name: Retire isolated TorBox preview release
on:
  push:
    branches: [feat/torbox-seek-preview]
    paths: [.github/workflows/torbox-seek-preview.yml]
permissions:
  actions: write
  contents: read
jobs:
  cancel-superseded-release:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel isolated release now moving to normal Tester
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status="$(gh api repos/$GITHUB_REPOSITORY/actions/runs/40011406834 --jq .status)"
          if [[ "$status" != "completed" ]]; then
            gh run cancel 40011406834 --repo "$GITHUB_REPOSITORY"
          fi
