name: Reshaped upstream merge validation

on:
  push:
    branches:
      - fix/upstream-beta3-preserve-reshaped

permissions:
  contents: read

concurrency:
  group: reshaped-upstream-merge-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        source: [baseline, merged]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.source == 'baseline' && 'd55d63b0e7e56882bc9f70de9cc675cb13d337b7' || github.sha }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Configure validation build
        run: |
          cat > local.properties <<'PROPERTIES'
          AUTOSYNC_FORK=true
          NUVIO_UPDATE_GITHUB_OWNER=DavidVamaiotu
          NUVIO_UPDATE_GITHUB_REPO=NuvioTV-Reshaped
          PROPERTIES
          keytool -genkeypair -keystore "$RUNNER_TEMP/merge-validation.jks" -storepass android -alias androiddebugkey -keypass android -dname "CN=Merge Validation" -keyalg RSA -keysize 2048 -validity 30
          {
            echo "NUVIO_RELEASE_STORE_FILE=$RUNNER_TEMP/merge-validation.jks"
            echo "NUVIO_RELEASE_STORE_PASSWORD=android"
            echo "NUVIO_RELEASE_KEY_ALIAS=androiddebugkey"
            echo "NUVIO_RELEASE_KEY_PASSWORD=android"
          } >> "$GITHUB_ENV"
      - name: Build APK and test Reshaped integration
        if: matrix.source == 'merged'
        run: |
          ./gradlew :app:assembleFullDebug :app:testFullDebugUnitTest --tests 'com.nuvio.tv.ui.screens.player.autosync.*' --tests 'com.nuvio.tv.ui.screens.player.audiosync.*' --tests 'com.nuvio.tv.reshaped.*' --tests 'com.nuvio.tv.core.connection.*' --tests 'com.nuvio.tv.ui.screens.player.seekpreview.*' --tests 'com.nuvio.tv.ui.screens.settings.SettingsCatalogTest' --tests 'com.nuvio.tv.ui.screens.player.PlayerMediaSourceFactoryTest' --tests 'com.nuvio.tv.updater.*' --build-cache --stacktrace
      - name: Save Reshaped test results
        if: matrix.source == 'merged' && always()
        uses: actions/upload-artifact@v4
        with:
          name: reshaped-feature-test-results
          path: app/build/test-results/testFullDebugUnitTest/
          if-no-files-found: error
          retention-days: 7
      - name: Compare known failing tests
        run: |
          set +e
          ./gradlew :app:testFullDebugUnitTest --tests 'androidx.media3.datasource.LocalhostZeroCopyDataSourceTest' --tests 'androidx.media3.exoplayer.upstream.DefaultAllocatorTest' --tests 'com.nuvio.tv.core.player.DolbyVisionBaseLayerPolicyTest' --tests 'com.nuvio.tv.core.player.FrameRateUtilsMkvSparseTracksTest' --tests 'com.nuvio.tv.core.player.MatroskaAfrProbeTest' --tests 'com.nuvio.tv.core.plugin.PluginBinaryFetchTest' --tests 'com.nuvio.tv.core.poster.CustomPosterUrlResolverTest' --tests 'com.nuvio.tv.data.local.CollectionsDataStoreSourceMigrationTest' --tests 'com.nuvio.tv.data.repository.CatalogRepositoryTypeTest' --tests 'com.nuvio.tv.data.repository.TraktAuthServiceTest' --tests 'com.nuvio.tv.ui.screens.player.NuvioExoPlayerPerformanceHelperTest' --tests 'com.nuvio.tv.ui.screens.player.PostPlayRecommendationStateTest' --tests 'com.nuvio.tv.ui.screens.player.TrackSelectionInvestigationTest' --build-cache --stacktrace
          TEST_STATUS=$?
          set -e
          python - <<'PY'
          import json, pathlib, xml.etree.ElementTree as ET
          files = list(pathlib.Path('app/build/test-results/testFullDebugUnitTest').glob('TEST-*.xml'))
          if not files:
              raise SystemExit('No JUnit reports: comparison build failed before tests ran')
          failed = []
          count = 0
          for path in files:
              root = ET.parse(path).getroot()
              count += int(root.attrib['tests'])
              for test in root.findall('testcase'):
                  if test.find('failure') is not None or test.find('error') is not None:
                      failed.append([test.attrib['classname'], test.attrib['name']])
          pathlib.Path('failure-summary-${{ matrix.source }}.json').write_text(json.dumps({'tests': count, 'failures': failed}))
          print(json.dumps({'tests': count, 'failures': failed}, indent=2))
          PY
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reshaped-comparison-${{ matrix.source }}
          path: |
            app/build/reports/tests/
            app/build/test-results/
            failure-summary-*.json
          if-no-files-found: ignore
          retention-days: 7

  compare:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: reshaped-comparison-*
          merge-multiple: true
          path: reports
      - name: Reject new test failures
        run: |
          python - <<'PY'
          import json, pathlib
          def read(source):
              path = next(pathlib.Path('reports').rglob('failure-summary-' + source + '.json'))
              return json.loads(path.read_text())
          baseline, merged = read('baseline'), read('merged')
          baseline_failures = set(map(tuple, baseline['failures']))
          merged_failures = set(map(tuple, merged['failures']))
          added = merged_failures - baseline_failures
          print('Baseline:', baseline['tests'], 'tests,', len(baseline_failures), 'failures')
          print('Merged:', merged['tests'], 'tests,', len(merged_failures), 'failures')
          print('New failures:', sorted(added))
          if added:
              raise SystemExit('Merge introduced new failing tests')
          PY
