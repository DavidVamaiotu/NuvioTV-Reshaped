name: Build & Release Nuvio RS (Gemini AI)

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release Tag (e.g. v1.1.0-gemini.1)"
        required: true
        default: "v1.1.0-gemini.1"
      create_release:
        description: "Create a GitHub Release with APKs"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Nuvio RS Gemini APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure Nuvio services
        env:
          SUPABASE_URL: ${{ secrets.NUVIO_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.NUVIO_SUPABASE_ANON_KEY }}
          SUPABASE_FALLBACK: ${{ secrets.NUVIO_SUPABASE_FALLBACK_URL }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          set -e

          URL="${SUPABASE_URL:-https://api.nuvio.tv}"
          KEY="${SUPABASE_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzgxNTIxMzQ2LCJleHAiOjE5MzkyMDEzNDZ9.tmQaj682pwzehpqlgCDMnySOqiUvpgRbrE43T4VJpDI}"
          FALLBACK="${SUPABASE_FALLBACK:-https://api.nuvio.tv}"
          TMDB="${TMDB_API_KEY:-82deccd78297a309d1d01ad9edd640e8}"

          cat > local.properties <<EOF2
          NUVIO_SUPABASE_URL=$URL
          NUVIO_SUPABASE_ANON_KEY=$KEY
          NUVIO_SUPABASE_FALLBACK_URL=$FALLBACK
          TMDB_API_KEY=$TMDB

          TV_LOGIN_WEB_BASE_URL=https://nuvio.tv/tv-login
          DEVICE_LOGIN_WEB_BASE_URL=https://nuvio.tv/link

          AVATAR_PUBLIC_BASE_URL=${URL%/}/storage/v1/object/public/avatars

          NUVIO_UPDATE_GITHUB_OWNER=${GITHUB_REPOSITORY_OWNER:-ozdek}
          NUVIO_UPDATE_GITHUB_REPO=${GITHUB_REPOSITORY#*/}
          AUTOSYNC_FORK=true

          SIMKL_CLIENT_ID=dc20e0db975583b15096267cee79cd23b1f56d4bd301ce3c51e4a96a49c834a6
          SIMKL_APP_NAME=nuvio

          INTRODB_API_URL=https://api.introdb.app/
          IMDB_RATINGS_API_BASE_URL=https://seriesgraph.com/
          IMDB_TAPFRAME_API_BASE_URL=https://imdb.tapframe.space/
          EOF2

          cp local.properties local.dev.properties

      - name: Configure signing
        env:
          KEYSTORE_BASE64: ${{ secrets.AUTOSYNC_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.AUTOSYNC_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.AUTOSYNC_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.AUTOSYNC_KEY_PASSWORD }}
        run: |
          set -e

          if [[ -n "$KEYSTORE_BASE64" && -n "$STORE_PASSWORD" ]]; then
            KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            keytool -list -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
            {
              echo "NUVIO_RELEASE_STORE_FILE=$KEYSTORE_PATH"
              echo "NUVIO_RELEASE_STORE_PASSWORD=$STORE_PASSWORD"
              echo "NUVIO_RELEASE_KEY_ALIAS=$KEY_ALIAS"
              echo "NUVIO_RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
          else
            echo "CI_USE_DEBUG_SIGNING=true" >> "$GITHUB_ENV"
          fi

      - name: Build Release APKs
        run: |
          ./gradlew \
            :app:assembleFullRelease \
            --build-cache \
            --stacktrace

      - name: Organize release APK assets
        run: |
          mkdir -p dist
          SRC="app/build/outputs/apk/full/release"
          TAG="${{ inputs.tag_name }}"
          
          cp "$SRC/app-full-arm64-v8a-release.apk" "dist/NuvioRS-${TAG}-arm64.apk" || true
          cp "$SRC/app-full-armeabi-v7a-release.apk" "dist/NuvioRS-${TAG}-arm32.apk" || true
          cp "$SRC/app-full-x86_64-release.apk" "dist/NuvioRS-${TAG}-x64.apk" || true
          cp "$SRC/app-full-x86-release.apk" "dist/NuvioRS-${TAG}-x32.apk" || true
          cp "$SRC/app-full-universal-release.apk" "dist/NuvioRS-${TAG}-universal.apk" || true
          ls -la dist/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NuvioRS-${{ inputs.tag_name }}-APKs
          path: dist/*.apk
          retention-days: 30

      - name: Create GitHub Release
        if: inputs.create_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag_name }}
        run: |
          gh release create "$TAG" dist/*.apk \
            --title "Nuvio RS $TAG (Gemini AI Translation)" \
            --notes "### What's New in this Build:
          - ✨ **Gemini AI Subtitle Translation**: Real-time dialogue translation to your preferred language with Google Gemini.
          - 📱 **QR Code Setup**: Scan from your phone to paste your Gemini API key seamlessly.
          - ⚡ **Auto-Translate & Smart Caching**: Instant subtitle translation without rebuffering.
          - 🔄 **AutoSync & Seek Previews**: All Nuvio RS upstream performance enhancements."
