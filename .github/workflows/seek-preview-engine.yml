name: Isolated seek preview validation

on:
  push:
    branches: [feature/isolated-seek-preview-engine, 'fix/seek-preview-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seek-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Configure isolated debug signing
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/preview-debug.jks" -storepass android -alias androiddebugkey -keypass android -dname "CN=Preview Test,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          printf 'NUVIO_RELEASE_STORE_FILE=%s/preview-debug.jks\nNUVIO_RELEASE_KEY_ALIAS=androiddebugkey\nNUVIO_RELEASE_KEY_PASSWORD=android\nNUVIO_RELEASE_STORE_PASSWORD=android\n' "$RUNNER_TEMP" > local.properties
      - name: Check native colour math and backend syntax
        run: python scripts/test_seek_preview_native.py
      - name: Compile preview integration
        run: ./gradlew :app:compileFullDebugKotlin --build-cache --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process -Dorg.gradle.jvmargs='-Xmx4096m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8' --stacktrace
      - name: Test previews
        run: ./gradlew :app:testFullDebugUnitTest --tests '*seekpreview*' --build-cache --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process -Dorg.gradle.jvmargs='-Xmx4096m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8' --stacktrace
      - name: Build APK and all native ABIs
        run: ./gradlew :app:assembleFullDebug --build-cache --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process -Dorg.gradle.jvmargs='-Xmx4096m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8' --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview-validation
          path: |
            app/build/reports/tests/testFullDebugUnitTest/
            app/build/outputs/apk/full/debug/*.apk
          retention-days: 7
